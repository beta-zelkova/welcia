<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希望休申請書</title>
    <!-- 画像として保存するためのライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ink: #2b2b2b;
            --line: #8a8a8a;
            --line-light: #d8d8d8;
            --paper: #ffffff;
            --shade: #f4f4f2;
            --accent: #3b5a6b;
            --accent-soft: #e8eef0;
            --off: #b5474c;
            --work: #2f6f4e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Meiryo", sans-serif;
            background: var(--shade);
            color: var(--ink);
            padding: 24px;
        }

        .wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ---- control panel (not printed) ---- */
        .panel {
            background: var(--paper);
            border: 1px solid var(--line-light);
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .panel h1 {
            font-size: 17px;
            margin: 0 0 14px;
            letter-spacing: .04em;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        .field-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .field {
            flex: 1;
            min-width: 180px;
        }

        .field label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .field input[type=text],
        .field input[type=month],
        .field input[type=number] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--line-light);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .field select {
            padding: 8px 6px;
            border: 1px solid var(--line-light);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .btnrow {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
            font-size: 13.5px;
            cursor: pointer;
            border-radius: 6px;
            padding: 9px 16px;
            border: 1px solid var(--accent);
            width: auto;
        }

        .primary {
            background: var(--accent);
            color: #fff;
        }

        .primary:hover {
            background: #314856;
        }

        .ghost {
            background: #fff;
            color: var(--accent);
        }

        .ghost:hover {
            background: var(--accent-soft);
        }

        /* 曜日一括入力ボタン用スタイル */
        .bulk-day-btn {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            min-width: 32px;
        }

        /* ---- document sheet ---- */
        .sheet {
            background: var(--paper);
            border: 1px solid var(--line-light);
            border-radius: 10px;
            padding: 34px 40px;
            overflow-x: auto;
        }

        .doc-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .15em;
            margin: 0 0 18px;
        }

        .notice {
            font-size: 12.5px;
            line-height: 1.9;
            margin: 0 0 14px;
        }

        table.headtbl {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            min-width: 300px;
        }

        table.headtbl td {
            border: 1px solid var(--ink);
            padding: 8px 10px;
            font-size: 13px;
        }

        table.headtbl td.label {
            width: 70px;
            font-weight: 700;
            background: #fafafa;
            white-space: nowrap;
        }

        table.headtbl input[type=text] {
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            width: 100%;
            background: transparent;
        }

        .period-note {
            font-size: 11.5px;
            color: #666;
            margin-top: 2px;
        }

        table.cal {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            empty-cells: show;
            min-width: 600px;
        }

        table.cal th {
            border: 1px solid var(--ink);
            padding: 6px 0;
            font-size: 13px;
            background: #fafafa;
            text-align: center;
            font-weight: 700;
        }

        table.cal td {
            border: 1px solid var(--ink);
            vertical-align: top;
            height: 94px;
            padding: 5px 6px;
            font-size: 11.5px;
            position: relative;
        }

        table.cal td.blank {
            background: #fbfbfa;
        }

        .daynum {
            font-weight: 700;
            font-size: 12.5px;
            margin-bottom: 3px;
        }

        .work-check {
            margin-bottom: 4px;
            display: flex;
            gap: 4px;
            font-size: 10px;
            flex-wrap: wrap;
        }

        .work-check label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 2px 0;
        }

        .work-check input[type="checkbox"] {
            margin: 0 2px 0 0;
            transform: scale(1.1);
            cursor: pointer;
        }

        .status-tag {
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 3px;
            text-align: center;
        }

        .status-tag.off {
            color: var(--off);
            font-size: 16px;
        }

        .reason-input {
            width: 100%;
            border: none;
            border-bottom: 1px dashed var(--line-light);
            outline: none;
            font-size: 11px;
            font-family: inherit;
            padding: 2px 0;
            background: transparent;
        }

        .time-box {
            font-size: 11px;
            line-height: 1.6;
        }

        .time-box select {
            font-size: 11px;
            font-family: inherit;
            border: 1px solid var(--line-light);
            border-radius: 4px;
            padding: 2px 0;
            vertical-align: middle;
            width: 100%;
            margin-bottom: 2px;
        }

        .time-box .arrow {
            margin: 0 2px;
        }

        .footnotes {
            font-size: 11.5px;
            line-height: 1.9;
            margin: 14px 0 0;
        }

        .otherbox {
            margin-top: 16px;
        }

        .otherbox .cap {
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--ink);
            border-bottom: none;
            padding: 6px 10px;
            background: #fafafa;
        }

        .otherbox textarea {
            width: 100%;
            height: 70px;
            border: 1px solid var(--ink);
            padding: 8px 10px;
            font-family: inherit;
            font-size: 12.5px;
            resize: vertical;
            outline: none;
        }

        /* ========================================================
           スマホ向けレイアウト調整
           ======================================================== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .panel {
                padding: 15px;
            }

            .sheet {
                padding: 15px;
            }

            .btnrow {
                flex-direction: column;
            }

            button {
                width: 100%;
                padding: 12px 16px;
            }

            /* 曜日一括入力ボタンは横並びを維持 */
            .bulk-day-btn {
                width: auto;
                padding: 10px 0;
            }

            .doc-title {
                font-size: 16px;
            }

            .notice {
                font-size: 11px;
            }

            .sheet-scroll-wrapper {
                overflow-x: auto;
                margin: 0 -15px;
                padding: 0 15px;
            }

            .time-box .arrow {
                display: none;
                /* スマホ画面の入力時は折り返すため非表示 */
            }
        }

        /* ========================================================
           画像書き出し時のスタイル（スクリプトから付与されるクラス）
           ======================================================== */
        body.export-mode .sheet {
            width: 800px !important;
            max-width: 800px !important;
            padding: 34px 40px !important;
            border: none !important;
            border-radius: 0 !important;
            overflow: visible !important;
        }

        body.export-mode .sheet-scroll-wrapper {
            overflow: visible !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body.export-mode .no-print {
            display: none !important;
        }

        body.export-mode table.cal {
            border-collapse: collapse !important;
            border: 1.5px solid #000 !important;
            min-width: 100% !important;
        }

        body.export-mode table.cal th,
        body.export-mode table.cal td {
            border: 1px solid #000 !important;
            background-clip: padding-box !important;
        }

        body.export-mode table.cal td.blank {
            background-color: #f2f2f2 !important;
            border: 1px solid #000 !important;
        }

        body.export-mode .time-box select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 13px;
            font-weight: 700;
            color: #000;
            width: auto;
            margin-bottom: 0;
        }

        body.export-mode .time-box .arrow {
            display: inline !important;
            margin: 0 4px;
        }

        body.export-mode .time-box br {
            display: none !important;
        }

        body.export-mode .time-box {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }

        body.export-mode .reason-input {
            border-bottom: none !important;
            text-align: center;
            font-size: 12px;
            color: #000;
            margin-top: 4px;
        }

        body.export-mode .reason-input::placeholder {
            color: transparent;
        }

        /* ========================================================
           印刷(PDF)向けスタイル
           ======================================================== */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .panel,
            .no-print {
                display: none !important;
            }

            .wrap {
                max-width: 100%;
            }

            .sheet {
                border: none;
                border-radius: 0;
                padding: 14mm 12mm;
                overflow: visible;
            }

            table.cal {
                border-collapse: collapse !important;
                border: 1.5px solid #000 !important;
                min-width: auto;
            }

            table.cal th,
            table.cal td {
                border: 1px solid #000 !important;
                background-clip: padding-box !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            table.cal td {
                height: 80px;
            }

            table.cal td.blank {
                background-color: #f2f2f2 !important;
                border: 1px solid #000 !important;
            }

            .time-box select {
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                border: none;
                background: transparent;
                padding: 0;
                font-size: 13px;
                font-weight: 700;
                color: #000;
                width: auto;
                margin-bottom: 0;
            }

            .time-box .arrow {
                display: inline !important;
                margin: 0 4px;
            }

            .time-box br {
                display: none;
            }

            .time-box {
                text-align: center;
                margin-top: 12px;
                font-size: 13px;
            }

            .reason-input {
                border-bottom: none !important;
                text-align: center;
                font-size: 12px;
                color: #000;
                margin-top: 4px;
            }

            .reason-input::placeholder {
                color: transparent;
            }

            @page {
                size: A4 portrait;
                margin: 8mm;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="panel no-print">
            <h1>希望休申請書 入力フォーム</h1>
            <div class="field-row">
                <div class="field">
                    <label>氏名</label>
                    <input type="text" id="inName" placeholder="山田 太郎">
                </div>
                <div class="field">
                    <label>対象月度</label>
                    <input type="month" id="inMonth">
                </div>
                <div class="field" style="max-width:220px;">
                    <label>基本の出勤時間（チェック時に自動入力）</label>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <select id="defStart"></select>
                        <span>〜</span>
                        <select id="defEnd"></select>
                    </div>
                </div>
            </div>

            <div class="field-row" style="margin-top: 16px;">
                <div class="field" style="flex-basis: 100%;">
                    <label>曜日一括出勤（カレンダー作成後に該当曜日をすべて「出勤」にします）</label>
                    <div style="display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;">
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(0)">月</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(1)">火</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(2)">水</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(3)">木</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(4)">金</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(5)">土</button>
                        <button type="button" class="ghost bulk-day-btn" onclick="setBulkWorkDay(6)">日</button>
                    </div>
                </div>
            </div>

            <div class="btnrow">
                <button class="primary" onclick="buildCalendar()">カレンダーを作成</button>
                <button class="ghost" onclick="clearAll()">入力内容をクリア</button>
                <button class="ghost" onclick="window.print()">PDF保存/印刷</button>
                <button class="ghost" onclick="saveAsImage()">画像保存</button>
            </div>
        </div>

        <div class="sheet" id="sheet">
            <div class="doc-title">希望休・研修日程・その他連絡</div>

            <p class="notice">
                ・必ず24日までにこの用紙を希望休入れBOXに入れてください。<br>
                ・毎月11日から翌月10日までの希望休を書いてください。
            </p>

            <table class="headtbl">
                <tr>
                    <td class="label">氏名</td>
                    <td><input type="text" id="printName" placeholder=""></td>
                    <td class="label">月度</td>
                    <td>
                        <div id="printMonthLabel"></div>
                    </td>
                </tr>
            </table>

            <div class="sheet-scroll-wrapper">
                <table class="cal" id="calTable">
                    <thead>
                        <tr>
                            <th>月</th>
                            <th>火</th>
                            <th>水</th>
                            <th>木</th>
                            <th>金</th>
                            <th>土</th>
                            <th>日</th>
                        </tr>
                    </thead>
                    <tbody id="calBody">
                        <tr>
                            <td class="blank" colspan="7" style="text-align:center;color:#999;font-style:normal;">
                                上の「対象月度」を選び「カレンダーを作成」を押してください
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="footnotes">
                ※休み希望は、理由も明記の上、提出する事。<br>
                ※出勤できる日は、時間帯を記入する事。<br>
                ※時間は、24時間表記でお願いします。
            </p>

            <div class="otherbox">
                <div class="cap">その他連絡事項</div>
                <textarea id="otherNotes" placeholder="何かお伝えしたい事がありましたら記入お願いします。"></textarea>
            </div>
        </div>
    </div>

    <script>
        const WEEKDAY_JP = ['月', '火', '水', '木', '金', '土', '日'];

        function syncName() {
            document.getElementById('printName').value = document.getElementById('inName').value;
        }
        document.getElementById('inName').addEventListener('input', syncName);

        function buildCalendar() {
            const monthVal = document.getElementById('inMonth').value;
            syncName();

            const calBody = document.getElementById('calBody');
            const monthLabelEl = document.getElementById('printMonthLabel');
            calBody.innerHTML = '';

            if (!monthVal) {
                calBody.innerHTML = '<tr><td class="blank" colspan="7" style="text-align:center;color:#999;">対象月度を選択してください</td></tr>';
                monthLabelEl.textContent = '';
                return;
            }

            const [y, m] = monthVal.split('-').map(Number);
            const start = new Date(y, m - 2, 11);
            const end = new Date(y, m - 1, 10);

            const fmt = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
            monthLabelEl.innerHTML = `${m}月度 <span style="color:#666;font-size:12px;">（${fmt(start)}〜${fmt(end)}）</span>`;

            const jsToMon = (jsDay) => (jsDay + 6) % 7;
            const firstOffset = jsToMon(start.getDay());

            let cur = new Date(start);
            cur.setDate(cur.getDate() - firstOffset);

            let finished = false;

            while (!finished) {
                const tr = document.createElement('tr');
                for (let c = 0; c < 7; c++) {
                    const td = document.createElement('td');
                    const d = new Date(cur);
                    const inRange = (d >= start && d <= end);

                    const daynum = document.createElement('div');
                    daynum.className = 'daynum';

                    if (!inRange) {
                        td.className = 'blank';
                        daynum.style.color = '#bbbbbb';
                        daynum.textContent = `${d.getMonth() + 1}/${d.getDate()}`;
                        td.appendChild(daynum);
                        td.appendChild(document.createTextNode('\u00A0'));
                    } else {
                        const id = 'day_' + d.getFullYear() + '_' + (d.getMonth() + 1) + '_' + d.getDate();
                        daynum.textContent = `${d.getDate()}`;
                        td.appendChild(daynum);

                        const chkWrap = document.createElement('div');
                        chkWrap.className = 'work-check no-print';
                        chkWrap.innerHTML = `
                            <label><input type="checkbox" id="${id}_chk_work" onchange="toggleStatus('${id}', 'work', this)">出勤</label>
                            <label><input type="checkbox" id="${id}_chk_off" onchange="toggleStatus('${id}', 'off', this)">休み</label>
                        `;
                        td.appendChild(chkWrap);

                        const offBox = document.createElement('div');
                        offBox.id = id + '_offbox';
                        offBox.style.display = 'none';
                        offBox.innerHTML = `
                            <div class="status-tag off">×</div>
                            <input type="text" class="reason-input" id="${id}_reason" placeholder="理由を記入">
                        `;
                        td.appendChild(offBox);

                        const workBox = document.createElement('div');
                        workBox.id = id + '_workbox';
                        workBox.style.display = 'none';
                        workBox.innerHTML = `
                            <div class="time-box">
                                <select id="${id}_start">${hourOptions()}</select><span class="arrow">〜</span>
                                <select id="${id}_end">${hourOptions()}</select>
                            </div>
                        `;
                        td.appendChild(workBox);
                    }

                    tr.appendChild(td);
                    cur.setDate(cur.getDate() + 1);
                }
                calBody.appendChild(tr);

                if (cur > end) {
                    finished = true;
                }
            }
        }

        function hourOptions() {
            let opts = '';
            for (let h = 0; h <= 24; h++) {
                const label = String(h).padStart(2, '0');
                opts += `<option value="${h}">${label}</option>`;
            }
            return opts;
        }

        function populateDefaultSelects() {
            const start = document.getElementById('defStart');
            const end = document.getElementById('defEnd');
            start.innerHTML = hourOptions();
            end.innerHTML = hourOptions();
            start.value = 19;
            end.value = 24;
        }

        function toggleStatus(id, type, checkbox) {
            const workChk = document.getElementById(id + '_chk_work');
            const offChk = document.getElementById(id + '_chk_off');

            if (type === 'work' && checkbox.checked) {
                offChk.checked = false;
            } else if (type === 'off' && checkbox.checked) {
                workChk.checked = false;
            }

            const offBox = document.getElementById(id + '_offbox');
            const workBox = document.getElementById(id + '_workbox');

            if (workChk.checked) {
                offBox.style.display = 'none';
                workBox.style.display = 'block';
                const defStart = document.getElementById('defStart').value;
                const defEnd = document.getElementById('defEnd').value;
                document.getElementById(id + '_start').value = defStart;
                document.getElementById(id + '_end').value = defEnd;
            } else if (offChk.checked) {
                offBox.style.display = 'block';
                workBox.style.display = 'none';
            } else {
                offBox.style.display = 'none';
                workBox.style.display = 'none';
            }
        }

        function setBulkWorkDay(targetDow) {
            const calBody = document.getElementById('calBody');

            if (!calBody || calBody.innerHTML.includes('対象月度を選択してください')) {
                alert('先に「カレンダーを作成」を押してください。');
                return;
            }

            const monthVal = document.getElementById('inMonth').value;
            if (!monthVal) return;

            const [y, m] = monthVal.split('-').map(Number);
            const start = new Date(y, m - 2, 11);
            const end = new Date(y, m - 1, 10);

            const jsToMon = (jsDay) => (jsDay + 6) % 7;

            let cur = new Date(start);
            while (cur <= end) {
                if (jsToMon(cur.getDay()) === targetDow) {
                    const id = 'day_' + cur.getFullYear() + '_' + (cur.getMonth() + 1) + '_' + cur.getDate();
                    const workChk = document.getElementById(id + '_chk_work');
                    if (workChk) {
                        workChk.checked = true;
                        toggleStatus(id, 'work', workChk);
                    }
                }
                cur.setDate(cur.getDate() + 1);
            }
        }

        function clearAll() {
            if (!confirm('入力内容をすべてクリアします。よろしいですか？')) return;
            document.getElementById('inName').value = '';
            setDefaultMonth();
            document.getElementById('otherNotes').value = '';
            document.getElementById('printName').value = '';
            buildCalendar();
        }

        function setDefaultMonth() {
            const today = new Date();
            const next = new Date(today.getFullYear(), today.getMonth() + 1, 1);
            const y = next.getFullYear();
            const m = String(next.getMonth() + 1).padStart(2, '0');
            document.getElementById('inMonth').value = `${y}-${m}`;
        }

        async function saveAsImage() {
            document.body.classList.add('export-mode');
            const target = document.getElementById('sheet');

            try {
                const canvas = await html2canvas(target, {
                    scale: 2,
                    windowWidth: 800,
                    backgroundColor: "#ffffff",
                });

                const link = document.createElement('a');
                const nameStr = document.getElementById('inName').value || '未記名';
                link.download = `希望休申請書_${nameStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (error) {
                console.error("画像保存エラー:", error);
                alert("画像の保存に失敗しました。");
            } finally {
                document.body.classList.remove('export-mode');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            populateDefaultSelects();
            setDefaultMonth();
            buildCalendar();
        });
    </script>
</body>

</html>
